<!DOCTYPE html>
<html lang="it" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests"
    />

    <title>Lunarium — Horologium Lunae</title>
    <meta
      name="description"
      content="Calendario lunare interattivo: la fase della Luna di oggi, le date del prossimo plenilunio e novilunio, con motti latini e immagini della NASA."
    />
    <meta
      name="keywords"
      content="fase lunare oggi, calendario lunare, plenilunio, novilunio, luna piena, luna nuova, fasi lunari, immagini NASA della Luna"
    />
    <meta name="author" content="negimatare" />
    <meta name="application-name" content="Lunarium" />
    <meta name="apple-mobile-web-app-title" content="Lunarium" />
    <meta name="robots" content="index, follow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="format-detection" content="telephone=no, date=no" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#06080f" />
    <link rel="canonical" href="https://negimatare.github.io/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:url" content="https://negimatare.github.io/" />
    <meta property="og:site_name" content="Lunarium" />
    <meta
      property="og:title"
      content="Lunarium — Horologium Lunae"
    />
    <meta
      property="og:description"
      content="Calendario lunare interattivo: la fase della Luna di oggi, le date del prossimo plenilunio e novilunio, con motti latini e immagini della NASA."
    />
    <meta
      property="og:image"
      content="https://negimatare.github.io/assets/social/preview.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta
      property="og:image:alt"
      content="Lunarium, Horologium Lunae: le fasi della Luna e una Luna piena su un cielo stellato"
    />
    <!-- Twitter (falls back to OG, only card type needed) -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Favicons -->
    <link rel="icon" href="assets/icons/favicon.ico" sizes="32x32" />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="assets/icons/icon-16x16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/icons/icon-32x32.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="assets/icons/apple-touch-icon.png"
    />
    <link rel="manifest" href="assets/icons/site.webmanifest" />

    <!-- Fonts -->
    <link
      rel="preload"
      href="assets/fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="assets/fonts/cinzel-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="css/main.css" />
    <noscript><link rel="stylesheet" href="css/noscript.css" /></noscript>
  </head>

  <body>
    <div class="stars" id="stars" aria-hidden="true"></div>

    <nav class="sidebar" id="sidebar" aria-label="Fasi lunari">
      <div class="sidebar-header">
        <span class="sidebar-subtitle" lang="la">Horologium Lunae</span>
      </div>
      <ul class="phase-list" id="phase-list" role="list"></ul>
    </nav>

    <main class="main">
      <section class="moon-info" aria-label="Fase lunare di oggi">
        <div class="info-top">
          <span class="info-overline" lang="la">Horologium Lunae</span>
          <time class="info-label" id="today-date"></time>
        </div>

        <h1 class="phase-name" id="phase-name">&mdash;</h1>

        <blockquote class="latin-sentence" id="latin-sentence" lang="la">
          &mdash;
        </blockquote>

        <p class="phase-description" id="phase-description">&mdash;</p>

        <div class="next-events" role="group" aria-label="Prossime fasi">
          <div class="event-card">
            <span class="event-icon" aria-hidden="true">&#127761;</span>
            <div>
              <span class="event-label" id="label-new" lang="la">Novilunium Proximum</span>
              <time
                class="event-date"
                id="next-new"
                aria-labelledby="label-new"
                >&mdash;</time
              >
            </div>
          </div>
          <div class="event-card">
            <span class="event-icon" aria-hidden="true">&#127765;</span>
            <div>
              <span class="event-label" id="label-full" lang="la">Plenilunium Proximum</span>
              <time
                class="event-date"
                id="next-full"
                aria-labelledby="label-full"
                >&mdash;</time
              >
            </div>
          </div>
        </div>
      </section>

      <figure class="moon-stage">
        <div class="moon-glow" aria-hidden="true"></div>
        <div class="moon-container">
          <img
            id="moon-image"
            alt="La Luna nella fase di oggi"
            width="1000"
            height="1000"
            decoding="async"
            fetchpriority="high"
          />
        </div>
      </figure>
    </main>

    <noscript>
      <div class="noscript-message">
        <h1>Lunarium</h1>
        <p>
          Calendario lunare interattivo: la fase della Luna di oggi, le date
          del prossimo plenilunio e novilunio, con motti latini e immagini
          della NASA.
        </p>
        <p>Attiva JavaScript per vedere il sito.</p>
      </div>
    </noscript>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Lunarium",
        "url": "https://negimatare.github.io/",
        "alternateName": "Horologium Lunae",
        "description": "Calendario lunare interattivo: la fase della Luna di oggi, le date del prossimo plenilunio e novilunio, con motti latini e immagini della NASA.",
        "applicationCategory": "UtilityApplication",
        "operatingSystem": "All",
        "inLanguage": ["it", "la"],
        "image": "https://negimatare.github.io/assets/social/preview.png",
        "author": {
          "@type": "Person",
          "name": "negimatare",
          "url": "https://github.com/negimatare"
        }
      }
    </script>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
